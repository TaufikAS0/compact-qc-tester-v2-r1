<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact QC • Riwayat unit laptop</title><style>body{font:16px system-ui;background:#0b1220;color:#e5edf6;max-width:1000px;margin:auto;padding:24px}button,input,a{padding:12px;margin:4px;border-radius:8px}button{cursor:pointer;background:#22d3ee;border:0}a{color:#22d3ee}.card{padding:20px;margin:16px 0;border:1px solid #334155;border-radius:12px}p{line-height:1.6}.FAIL{color:#f87171}.PASS{color:#34d399}.INCOMPLETE{color:#fbbf24}</style>
<h1>Arsip QC laptop</h1><p>Impor unduhan JSON/bundle dari dashboard berbagai device/IP. Laporan lama tidak ditimpa. Tidak membuka COM atau menghubungi device. Impor memeriksa struktur/konsistensi, bukan membuktikan keaslian atau QC fisik.</p><a href="/">Penguji serial</a><input id="files" type="file" accept=".json" multiple><button id="import">Impor snapshot/bundle</button><input id="search" placeholder="Cari serial / PIC"><button id="refresh">Muat ulang</button><p id="status"></p><div id="rows"></div>
<script>
'use strict';const $=id=>document.getElementById(id);let token='',items=[];async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,localToken:token})}:{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d;}
function render(){const query=$('search').value.trim().toLowerCase(),groups=new Map();for(const r of items.filter(i=>(i.serial+' '+i.operator).toLowerCase().includes(query))){if(!groups.has(r.serial))groups.set(r.serial,[]);groups.get(r.serial).push(r);}$('rows').replaceChildren();for(const [serial,reports] of groups){const root=document.createElement('div'),h=document.createElement('h2');root.className='card';h.textContent=serial+' • '+reports.length+' percobaan';root.append(h);for(const r of reports){const p=document.createElement('p'),links=document.createElement('div');p.className=r.status;p.textContent=r.profile+' • '+r.status+' • '+r.operator+' • '+r.qcDate+' • '+r.qcCode+' • '+(r.failures.map(t=>t.name+': '+t.detail).join('; ')||'Tidak ada FAIL, periksa tes belum selesai.');for(const ext of ['json','csv']){const a=document.createElement('a');a.href='/archive/'+r.id+'.'+ext;a.download='QC-'+serial+'-'+r.id.slice(0,8)+'.'+ext;a.textContent='Unduh '+ext.toUpperCase();links.append(a);}root.append(p,links);}if(reports.length>1){const p=document.createElement('p');p.textContent='Status dua impor terbaru: '+reports[1].status+' → '+reports[0].status+'. Setiap hasil disimpan terpisah; urutan impor bukan jaminan urutan pengujian.';root.append(p);}$('rows').append(root);}}
async function refresh(){try{const s=await api('/api/state');token=s.localToken;const d=await api('/api/archive');items=d.items;$('status').textContent=items.length+' laporan; '+d.errors.length+' file bermasalah'+(d.errors.length?' • '+d.errors.map(e=>e.file+': '+e.error).join('; '):'');render();}catch(e){$('status').textContent=e.message;}}
$('import').onclick=async()=>{try{const files=[...$('files').files];if(!files.length)throw Error('Pilih JSON/bundle dahulu');let added=0,duplicates=0;for(const f of files){if(f.size>4*1024*1024)throw Error('File maksimum4MB');const payload=JSON.parse(await f.text()),d=await api('/api/archive/import',{payload});added+=d.added;duplicates+=d.duplicates;}await refresh();$('status').textContent+=' • '+added+' baru, '+duplicates+' duplikat. File tersimpan di reports/archive pada laptop ini.';}catch(e){$('status').textContent='Impor gagal: '+e.message+'. Impor yang sudah berhasil tetap disimpan; ulangi aman terhadap duplikat.';}};$('refresh').onclick=refresh;$('search').oninput=render;refresh();
</script></html>
